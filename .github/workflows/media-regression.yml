name: Media regression

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      run_live_monitor:
        description: Run the opt-in live-site smoke monitor
        required: false
        default: false
        type: boolean
      run_windows_live:
        description: Run the Windows self-hosted player smoke when a configured PC is online
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deterministic-regression-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:media-sites
      - run: npm test
      - run: npm run build:dev-staging

  deterministic-regression-self-hosted:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, ARM64, segma-player]
    timeout-minutes: 15
    env:
      NPM_CONFIG_CACHE: /var/lib/devspace/npm-cache-segma-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:media-sites
      - run: npm test
      - run: npm run build:dev-staging

  windows-compile:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.95
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Check companion contract
        run: cargo check --locked --manifest-path companion-contract/Cargo.toml --all-targets
      - name: Check native host
        run: cargo check --locked --manifest-path native-host/Cargo.toml --all-targets
      - name: Check Windows player
        run: cargo check --locked --manifest-path companion-gui/Cargo.toml --all-targets
      - name: Run Windows player tests
        run: cargo test --locked --manifest-path companion-gui/Cargo.toml

  windows-live-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_windows_live
    runs-on: [self-hosted, Windows, X64, segma-player-live]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustc --version
          cargo --version
      - name: Build Windows player
        run: cargo build --locked --release --manifest-path companion-gui/Cargo.toml
      - name: Launch and verify manager responsiveness
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'companion-gui\target\release\aura-media-manager.exe'
          if (-not (Test-Path $exe)) { throw "Player executable not found: $exe" }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) { throw "Player exited during smoke startup." }
            if (-not $process.Responding) { throw "Player is not responding during smoke startup." }
            Write-Host "Player process is alive and responding."
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Fullscreen live verification reminder
        shell: pwsh
        run: |
          Write-Host "This runner is reserved for interactive mpv/fullscreen regression checks."
          Write-Host "The automated step currently verifies native Windows build and manager responsiveness; playback/fullscreen interaction still requires a configured live-smoke harness."

  live-site-monitor:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_live_monitor) ||
      (github.event_name == 'schedule' && vars.AURA_ENABLE_LIVE_MONITOR == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Run redacted live monitor
        env:
          AURA_MONITOR_HEADLESS: "1"
          AURA_MONITOR_AUTOPLAY: "1"
          AURA_MONITOR_ALLOW_BLOCKED: "1"
          AURA_MONITOR_REPORT: artifacts/live-media-smoke.json
        run: npm run monitor:media-sites
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-media-smoke
          path: artifacts/live-media-smoke.json
          if-no-files-found: warn
          retention-days: 14
