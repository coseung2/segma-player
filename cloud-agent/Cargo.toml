[package]
name = "aura-media-cloud"
version = "0.4.73"
edition = "2021"

[dependencies]
aura-companion-contract = { path = "../companion-contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "form", "json", "multipart", "rustls"] }
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[workspace]
