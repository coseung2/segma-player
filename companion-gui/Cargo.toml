[package]
name = "aura-media-manager"
version = "0.4.63"
edition = "2021"
rust-version = "1.95"
build = "build.rs"

# Native manager window for Segma Player.
#
# Separate crate from `native-host` on purpose: the native host is a small
# stdio process that Chrome spawns, and it must stay free of GUI dependencies.
# This binary is launched by `--manager` and owns the window.

[dependencies]
aura-companion-contract = { path = "../companion-contract" }
eframe = { version = "=0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_extras = { version = "=0.36.1", default-features = false, features = ["image", "svg"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6"] }
raw-window-handle = "=0.6.2"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Pipes",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "=0.1.23"

[profile.release]
lto = "thin"
strip = true

# Keeps the manager binary out of the extension's dev-staging allowlist checks
# and the native host's dependency graph.
[workspace]
