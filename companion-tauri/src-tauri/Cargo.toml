[package]
name = "segma-player-tauri"
version = "0.4.73"
description = "Segma Player desktop companion shell"
authors = ["Segma Player"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "segma_player_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aura-media-manager"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-single-instance = { version = "2.4.4" }
aura-companion-contract = { path = "../../companion-contract" }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
] }
