<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura VPN HLS 다운로드</title>
    <style>
      :root { color-scheme: dark; font-family: "Segoe UI", "Malgun Gothic", sans-serif; background: #10141c; color: #f4f7fb; }
      body { width: 360px; margin: 0; padding: 22px; box-sizing: border-box; background: #10141c; }
      h1 { margin: 0 0 12px; font-size: 18px; }
      #status { color: #aab7c9; font-size: 13px; line-height: 1.5; }
      .error { color: #ff9a9a; }
      #start-download { width: 100%; min-height: 38px; margin-top: 14px; border: 0; border-radius: 10px; background: #eaf1ff; color: #1e3865; cursor: pointer; font-size: 13px; font-weight: 750; }
      #start-download:disabled { opacity: .55; cursor: wait; }
      #hint { margin: 10px 0 0; color: #8f9db0; font-size: 12px; line-height: 1.5; }
      #version { margin: 16px 0 0; color: #5f6d82; font-size: 10px; }
    </style>
  </head>
  <body>
    <h1>HLS 다운로드</h1>
    <p id="status" role="status" aria-live="polite">플레이리스트를 확인하는 중…</p>
    <button id="start-download" type="button" hidden>저장 위치 선택 후 다운로드</button>
    <p id="hint" role="status" aria-live="polite" hidden>
      저장이 진행되는 동안 파일을 VLC 등 플레이어로 열면 다운로드가 끝나기 전에도 바로 재생할 수 있습니다.
    </p>
    <p id="version" class="version"></p>
    <script type="module" src="hls-download.js"></script>
  </body>
</html>
