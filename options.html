<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="settings.title">Segma Player settings</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", sans-serif;
        background: #F7F8F9;
        color: #17191D;
      }
      body { width: 100%; min-height: 100vh; margin: 0; padding: 20px 16px 24px; background: #F7F8F9; color: #17191D; }
      body::before { display: block; margin-bottom: 18px; color: #FFA31A; content: "SEGMA PLAYER"; font-size: 11px; font-weight: 800; letter-spacing: .16em; }
      section { padding: 16px 0; }
      .label { margin: 0 0 8px; color: #17191D; font-size: 13px; font-weight: 700; }
      .desc { margin: 0 0 12px; color: #59616D; font-size: 11px; line-height: 1.5; }
      button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; white-space: nowrap; }
      button:disabled { cursor: default; opacity: .48; }
      .block { width: 100%; text-align: left; }
      .primary { background: #FFA31A; color: #17191D; }
      .primary:hover:not(:disabled) { background: #E89300; }
      .ghost { border: 1px solid #D2D5DB; background: #FFFFFF; color: #17191D; }
      .ghost:hover:not(:disabled) { border-color: #FFA31A; background: #FFF4DF; }
      .link-button { display: flex; min-height: 44px; align-items: center; justify-content: center; margin-top: 12px; padding: 0; border: 1px solid #D6D9DE; border-radius: 8px; background: transparent; color: #7A4B00; font-size: 11px; font-weight: 750; text-decoration: none; }
      .link-button:hover { background: #FFF4DF; color: #17191D; }
      .link-button[hidden] { display: none; }
      :focus-visible { outline: 2px solid #FFA31A; outline-offset: 2px; }
      .status { margin: 8px 0 0; color: #59616D; font-size: 11px; line-height: 1.5; }
      .status.is-ready { color: #1F7A4C; }
      .status.is-error { color: #7A4B00; }
      @media (max-width: 340px) { body { padding-inline: 12px; } }
    </style>
  </head>
  <body>
    <section id="companion-section">
      <p class="label" data-i18n="settings.companion">Segma Player</p>
      <p class="desc" data-i18n="settings.companionHelp">Jobs, playback, subtitles, the save folder, and your license live in Segma Player.</p>
      <p id="companion-status" class="status" role="status" aria-live="polite" data-i18n="companion.checking">Checking Segma Player…</p>
      <button id="companion-open" class="primary block" type="button" data-i18n="companion.open">Open Segma Player</button>
      <a id="companion-help" class="link-button" target="_blank" rel="noreferrer" data-i18n="companion.install" hidden>Install Windows Companion</a>
    </section>
    <script type="module" src="options.js"></script>
  </body>
</html>
