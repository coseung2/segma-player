<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura Media Player</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f16;
        color: #eef2f7;
        font-family: "Pretendard", "Segoe UI", system-ui, sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      header .spacer {
        flex: 1;
      }
      header button {
        flex: none;
        padding: 6px 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      header button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      header .tag {
        flex: none;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(47, 111, 237, 0.25);
        color: #9dbcf5;
        font-size: 11px;
        font-weight: 700;
      }
      .stage {
        position: relative;
        flex: 1;
        display: grid;
        place-items: center;
        background: #000;
        overflow: hidden;
      }
      video {
        width: 100%;
        height: 100%;
        max-height: 100%;
      }
      #subtitle {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: 9%;
        margin: 0;
        text-align: center;
        font-size: clamp(16px, 2.6vw, 30px);
        font-weight: 700;
        line-height: 1.35;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95), 0 0 6px rgba(0, 0, 0, 0.7);
        white-space: pre-line;
        pointer-events: none;
        user-select: none;
      }
      #message {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        font-size: 14px;
        line-height: 1.6;
        color: #9aa7b8;
        background: #0b0f16;
      }
      #message[hidden] {
        display: none;
      }
      .player-toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 4;
        max-width: min(320px, calc(100vw - 32px));
        margin: 0;
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 9px;
        background: rgba(24, 34, 50, 0.95);
        color: #fff;
        font-size: 12px;
        line-height: 1.4;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      }
      #message p {
        margin: 0 0 14px;
      }
      .message-action {
        padding: 8px 12px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: #2f6fed;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      .message-action:disabled {
        opacity: 0.65;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Aura Media Player</h1>
      <span class="spacer"></span>
      <button id="save" type="button">컬렉션에 저장</button>
      <span id="subtitle-tag" class="tag" hidden>자막</span>
    </header>
    <main class="stage">
      <video id="video" controls playsinline></video>
      <p id="subtitle" hidden></p>
      <div id="message" hidden></div>
    </main>
    <script type="module" src="player.js"></script>
  </body>
</html>
