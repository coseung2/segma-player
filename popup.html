<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="app.title">Segma Player</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand-block">
          <svg class="brand-mark" width="28" height="28" viewBox="192 192 640 640" aria-hidden="true" focusable="false">
            <path d="M232 192H512V296C554 296 568 330 568 352C568 374 554 408 512 408V512H408C408 554 374 568 352 568C330 568 296 554 296 512H192V232C192 210 210 192 232 192Z" fill="#17191D"/>
            <path d="M512 192H792C814 192 832 210 832 232V512H728C728 554 694 568 672 568C650 568 616 554 616 512H512V408C554 408 568 374 568 352C568 330 554 296 512 296V192Z" fill="#59616D"/>
            <path d="M192 512H296C296 554 330 568 352 568C374 568 408 554 408 512H512V616C554 616 568 650 568 672C568 694 554 728 512 728V832H232C210 832 192 814 192 792V512Z" fill="#D6D9DE"/>
            <path d="M512 512H616C616 554 650 568 672 568C694 568 728 554 728 512H832V792C832 814 814 832 792 832H512V728C554 728 568 694 568 672C568 650 554 616 512 616V512Z" fill="#FFA31A"/>
            <path d="M455 434L589 512L455 590V434Z" fill="#FFFFFF"/>
          </svg>
          <div class="title-copy">
            <div class="title-row">
              <h1 data-i18n="app.heading">Segma Player</h1>
            </div>
          </div>
        </div>
        <div class="header-actions">
          <div class="locale-menu-wrap">
            <button id="locale" class="icon-button" type="button" data-i18n-label="app.language" aria-label="Language" title="Language" aria-haspopup="true" aria-expanded="false">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M2 12h20"></path>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
              </svg>
            </button>
            <div id="locale-menu" class="locale-menu" role="menu" data-i18n-label="app.language" aria-label="Language" hidden></div>
          </div>
          <button id="refresh" class="icon-button" type="button" data-i18n-label="app.refresh" aria-label="Reload the current tab">↻</button>
        </div>
      </header>

      <section id="companion-card" class="companion-card" data-i18n-label="companion.statusRegion" aria-label="Segma Player connection">
        <p id="companion-status" class="companion-status" role="status" aria-live="polite" data-i18n="companion.checking">Checking Segma Player…</p>
        <a id="companion-help" class="companion-help" target="_blank" rel="noreferrer" data-i18n="companion.install" hidden>Install Windows Companion</a>
        <button id="companion-open" class="secondary-button" type="button" data-i18n="companion.open">Open Segma Player</button>
      </section>

      <div class="tab-list" role="tablist" data-i18n-label="app.tablist" aria-label="Download tools">
        <button id="tab-detect" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="panel-detect" data-tab="detect" data-i18n="tab.detect">Detect media</button>
        <button id="tab-link" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-link" data-tab="link" data-i18n="tab.link">Paste link</button>
      </div>

      <section id="panel-detect" class="tab-panel" role="tabpanel" aria-labelledby="tab-detect">
        <p id="status" class="status" role="status" aria-live="polite" data-i18n="detect.checking">Checking this page…</p>
        <div class="detect-controls">
          <span id="summary" class="summary"></span>
          <div class="detect-options">
            <label class="main-toggle"><input id="main-only" type="checkbox" checked /> <span data-i18n="detect.mainOnly">Main only</span></label>
          </div>
        </div>
        <section id="candidates" class="candidate-list" aria-live="polite"></section>
        <button id="rescan" class="primary-button action-button" type="button" data-i18n="detect.rescan">Scan this page again</button>
      </section>

      <section id="panel-link" class="tab-panel" role="tabpanel" aria-labelledby="tab-link" hidden>
        <p class="storage-note" data-i18n="link.note">Paste a media address or player page to send it to Segma Player.</p>
        <label class="field-label" for="direct-url" data-i18n="link.addressLabel">Media address</label>
        <input id="direct-url" type="url" data-i18n-placeholder="link.addressPlaceholder" placeholder="Media / player" spellcheck="false" />
        <div id="youtube-quality-row" class="quality-row" hidden>
          <label class="field-label" for="youtube-quality" data-i18n="quality.label">Quality</label>
          <select id="youtube-quality">
            <option value="best">Best quality · Auto</option>
            <option value="1080">Up to 1080p</option>
            <option value="720">Up to 720p</option>
            <option value="480">Up to 480p</option>
          </select>
        </div>
        <button id="download-url" class="primary-button action-button" type="button" data-i18n="action.download">Download</button>
        <p id="direct-status" class="field-status" role="status" aria-live="polite" hidden></p>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
