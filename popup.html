<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura 미디어 다운로드</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div><p class="eyebrow">AURA</p><h1>미디어 다운로드</h1></div>
        <button id="refresh" class="icon-button" type="button" aria-label="현재 탭 새로고침">↻</button>
      </header>

      <div class="tab-list" role="tablist" aria-label="다운로드 기능">
        <button id="tab-detect" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="panel-detect" data-tab="detect">미디어 감지</button>
        <button id="tab-downloads" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-downloads" data-tab="downloads">다운로드</button>
        <button id="tab-youtube" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-youtube" data-tab="youtube">YouTube</button>
        <button id="tab-blocking" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-blocking" data-tab="blocking">차단</button>
      </div>

      <section id="panel-detect" class="tab-panel" role="tabpanel" aria-labelledby="tab-detect">
        <p id="status" class="status" role="status" aria-live="polite">현재 페이지 확인 중…</p>
        <div class="detect-controls">
          <span id="summary" class="summary"></span>
          <label class="main-toggle"><input id="main-only" type="checkbox" checked /> 메인만</label>
        </div>
        <section id="candidates" class="candidate-list" aria-live="polite"></section>
        <section class="direct-download" aria-labelledby="direct-title">
          <strong id="direct-title">주소 직접 입력</strong>
          <input id="direct-url" type="url" placeholder="m3u8 / mp4 / 플레이어 주소" spellcheck="false" />
          <button id="download-url" class="secondary-button" type="button">이 주소 다운로드</button>
          <p id="direct-status" class="field-status" role="status" aria-live="polite"></p>
        </section>
        <button id="rescan" class="primary-button" type="button">현재 페이지 다시 감지</button>
      </section>

      <section id="panel-downloads" class="tab-panel" role="tabpanel" aria-labelledby="tab-downloads" hidden>
        <p class="storage-note">저장 위치 · Downloads\Aura Media</p>
        <section id="download-jobs" class="job-list" aria-live="polite"></section>
      </section>

      <section id="panel-youtube" class="tab-panel" role="tabpanel" aria-labelledby="tab-youtube" hidden>
        <div class="youtube-card">
          <span class="youtube-mark" aria-hidden="true">
            <svg viewBox="0 0 16 16" focusable="false">
              <path d="M4 2.75v10.5L13 8 4 2.75Z" />
            </svg>
          </span>
          <div><strong>YouTube 영상 저장</strong><p>공개 단일 영상을 MP4로 Downloads 폴더에 저장합니다.</p></div>
        </div>
        <label class="field-label" for="youtube-url">YouTube 주소</label>
        <input id="youtube-url" type="url" placeholder="https://www.youtube.com/watch?v=…" spellcheck="false" />
        <label class="field-label" for="youtube-quality">화질</label>
        <select id="youtube-quality">
          <option value="best">최고 화질 · 자동</option>
          <option value="2160">최대 2160p · 4K</option>
          <option value="1440">최대 1440p</option>
          <option value="1080">최대 1080p</option>
          <option value="720">최대 720p</option>
          <option value="480">최대 480p</option>
        </select>
        <button id="youtube-download" class="primary-button" type="button">YouTube 다운로드</button>
        <p id="youtube-status" class="field-status" role="status" aria-live="polite"></p>
        <p class="legal-note">로그인·비공개·유료·DRM 콘텐츠 우회는 지원하지 않습니다.</p>
      </section>

      <section id="panel-blocking" class="tab-panel" role="tabpanel" aria-labelledby="tab-blocking" hidden>
        <div class="blocking-card">
          <p class="eyebrow">AURA VPN</p>
          <strong id="blocking-site" class="blocking-site">현재 사이트 확인 중…</strong>
          <p id="blocking-detail" class="field-status" role="status" aria-live="polite"></p>
          <button id="blocking-toggle" class="primary-button" type="button">이 사이트에서 끄기</button>
        </div>
        <div class="blocking-stats" role="group" aria-label="오늘 차단 통계">
          <div class="blocking-stat"><strong id="stat-requests">0</strong><span>차단 요청</span></div>
          <div class="blocking-stat"><strong id="stat-elements">0</strong><span>숨긴 광고 영역</span></div>
          <div class="blocking-stat"><strong id="stat-popups">0</strong><span>팝업·오버레이</span></div>
        </div>
        <button id="blocking-options" class="secondary-button" type="button">필터 선택 · 설정 열기</button>
        <p class="legal-note">개인용 내장 필터로 동작하며, 광고·추적기·팝업 차단 범위는 설정에서 고를 수 있습니다.</p>
      </section>

      <button id="scroll-more" class="scroll-more" type="button" aria-label="아래 내용 더 보기" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="m7 6 5 5 5-5" />
          <path d="m7 13 5 5 5-5" />
        </svg>
      </button>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
