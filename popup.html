<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura 미디어 다운로드</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div><p class="eyebrow">AURA</p><div class="title-row"><h1>미디어 다운로드</h1><span id="plan-badge" class="plan-badge"></span></div></div>
        <div class="header-actions">
          <button id="settings" class="icon-button" type="button" aria-label="설정" title="설정">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <button id="refresh" class="icon-button" type="button" aria-label="현재 탭 새로고침">↻</button>
        </div>
      </header>

      <section id="plan-card" class="plan-card" aria-label="현재 이용 플랜">
        <p id="plan-summary" class="plan-summary"></p>
        <div id="pro-offer" class="pro-offer" hidden>
          <p id="pro-benefits" class="pro-benefits"></p>
          <a id="upgrade-link" class="upgrade-link" target="_blank" rel="noreferrer" hidden>Pro 보기</a>
          <a id="license-entry" class="upgrade-link" href="#">Pro 키 입력</a>
        </div>
      </section>

      <div class="tab-list" role="tablist" aria-label="다운로드 기능">
        <button id="tab-detect" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="panel-detect" data-tab="detect">미디어 감지</button>
        <button id="tab-link" class="tab" type="button" role="tab" aria-selected="false" aria-controls="panel-link" data-tab="link">링크 입력</button>
      </div>

      <section id="panel-detect" class="tab-panel" role="tabpanel" aria-labelledby="tab-detect">
        <p id="status" class="status" role="status" aria-live="polite">현재 페이지 확인 중…</p>
        <div class="detect-controls">
          <span id="summary" class="summary"></span>
          <div class="detect-options">
            <label class="main-toggle"><input id="main-only" type="checkbox" checked /> 메인만</label>
          </div>
        </div>
        <div id="detect-jobs-tools" class="job-list-tools" hidden>
          <button id="detect-jobs-toggle" class="job-list-tool" type="button" aria-expanded="true">진행 목록 접기</button>
          <button id="detect-jobs-clear" class="job-list-tool" type="button">기록 비우기</button>
        </div>
        <section id="candidates" class="candidate-list" aria-live="polite"></section>
        <button id="rescan" class="primary-button" type="button">현재 페이지 다시 감지</button>
        <section id="detect-jobs" class="job-list" aria-live="polite" hidden></section>
      </section>

      <section id="panel-link" class="tab-panel" role="tabpanel" aria-labelledby="tab-link" hidden>
        <p class="storage-note">미디어 주소 · 플레이어 페이지 · 유튜브 주소를 붙여넣어 저장합니다.</p>
        <label class="field-label" for="direct-url">미디어 주소</label>
        <input id="direct-url" type="url" placeholder="미디어 / 플레이어" spellcheck="false" />
        <div id="youtube-quality-row" class="quality-row" hidden>
          <label class="field-label" for="youtube-quality">화질</label>
          <select id="youtube-quality">
            <option value="1080">최대 1080p</option>
            <option value="720">최대 720p</option>
            <option value="480">최대 480p</option>
          </select>
        </div>
        <button id="download-url" class="primary-button" type="button">다운로드</button>
        <p id="direct-status" class="field-status" role="status" aria-live="polite" hidden></p>
        <div id="link-jobs-tools" class="job-list-tools" hidden>
          <button id="link-jobs-toggle" class="job-list-tool" type="button" aria-expanded="true">진행 목록 접기</button>
          <button id="link-jobs-clear" class="job-list-tool" type="button">기록 비우기</button>
        </div>
        <section id="link-jobs" class="job-list" aria-live="polite" hidden></section>
        <p id="link-save-status" class="save-status" role="status" hidden></p>
      </section>

    </main>

    <section id="settings-overlay" class="settings-overlay" role="dialog" aria-modal="true" aria-label="설정" hidden>
      <header class="settings-overlay-header">
        <h2>설정</h2>
        <button id="settings-close" class="icon-button" type="button" aria-label="설정 닫기">×</button>
      </header>
      <iframe id="settings-frame" src="options.html" title="Aura Media 설정"></iframe>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
