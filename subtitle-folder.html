<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aura Media — 자막 폴더</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #10161f;
        color: #eef2f7;
        font-family: "Pretendard", "Segoe UI", system-ui, sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 32px));
        padding: 28px;
        border-radius: 16px;
        background: #182130;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 17px;
      }
      p {
        margin: 0 0 16px;
        font-size: 13px;
        line-height: 1.55;
        opacity: 0.85;
      }
      button {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 10px;
        background: #2f6fed;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .current {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        font-size: 12px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>자막 폴더 선택</h1>
      <p>
        자막(.srt)이 있는 폴더를 선택하면 재생 시 자동으로 찾습니다. 생성한 자막도 이
        폴더에 SRT로 보관합니다. 파일명에 영상 식별자(예: JUQ-921)가 포함된 자막이면
        중첩 폴더까지 검색합니다.
      </p>
      <button id="pick" type="button">폴더 선택</button>
      <div id="current" class="current" hidden></div>
    </main>
    <script type="module">
      import { getStoredSubtitleDirectory, storeSubtitleDirectory } from "./subtitle-folder.js";

      const button = document.getElementById("pick");
      const current = document.getElementById("current");

      async function refreshCurrent() {
        const handle = await getStoredSubtitleDirectory();
        if (handle) {
          current.hidden = false;
          current.textContent = `현재 폴더: ${handle.name}`;
        }
      }

      button.addEventListener("click", async () => {
        try {
          const handle = await window.showDirectoryPicker({ mode: "readwrite" });
          const saved = await storeSubtitleDirectory(handle);
          if (saved) {
            button.textContent = "저장됨 — 이 탭을 닫아도 됩니다";
            button.disabled = true;
            await refreshCurrent();
          } else {
            button.textContent = "저장 실패 — 다시 시도";
          }
        } catch {
          // Picker dismissed by the user; nothing to do.
        }
      });

      refreshCurrent();
    </script>
  </body>
</html>
